# Netlify configuration — static site, no build step
[build]
  publish = "."
  command = ""

# Pretty URLs: /about instead of /about.html
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200
[[redirects]]
  from = "/products"
  to = "/products.html"
  status = 200
[[redirects]]
  from = "/blog"
  to = "/blog.html"
  status = 200
[[redirects]]
  from = "/partners"
  to = "/partners.html"
  status = 200
[[redirects]]
  from = "/careers"
  to = "/careers.html"
  status = 200
[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200
[[redirects]]
  from = "/business"
  to = "/plstka-business.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
